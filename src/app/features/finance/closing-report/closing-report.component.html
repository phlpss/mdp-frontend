<div class="mdp-container">
    <div class="page-header">
        <div>
            <h2>Daily Closing Report</h2>
            <p class="subtitle">Submit end-of-day cash reconciliation</p>
        </div>
    </div>

    <mat-card class="mdp-card" style="max-width:560px">
        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()">

                <mat-form-field appearance="outline" class="mdp-full-width">
                    <mat-label>Report Date</mat-label>
                    <input matInput [matDatepicker]="dp" formControlName="date">
                    <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
                    <mat-datepicker #dp></mat-datepicker>
                    <mat-error>Date is required</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="mdp-full-width">
                    <mat-label>Location</mat-label>
                    <input matInput [value]="locationId ?? 'Not set'" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="mdp-full-width">
                    <mat-label>System Total</mat-label>
                    <span matPrefix>$&nbsp;</span>
                    <input matInput [value]="systemTotalLoading ? 'Loading…' : systemTotal.toFixed(2)" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="mdp-full-width">
                    <mat-label>Actual Total (cash count)</mat-label>
                    <span matPrefix>$&nbsp;</span>
                    <input matInput type="number" step="0.01" formControlName="actualTotal" placeholder="0.00">
                    <mat-error>Enter a valid amount</mat-error>
                </mat-form-field>

                <div class="discrepancy-row" *ngIf="form.get('actualTotal')?.value !== null">
                    <span class="disc-label">Discrepancy</span>
                    <span class="disc-chip" [ngClass]="discrepancyClass">
            {{ discrepancy >= 0 ? '+' : '' }}{{ discrepancy | number:'1.2-2' }}
          </span>
                </div>

                <button mat-raised-button color="primary" type="submit"
                        class="mdp-full-width" style="margin-top:16px"
                        [disabled]="submitting">
                    <mat-spinner *ngIf="submitting" diameter="20" style="display:inline-block;margin-right:8px"></mat-spinner>
                    {{ submitting ? 'Submitting…' : 'Submit Report' }}
                </button>
            </form>

            <div *ngIf="submitResult" class="result-banner" [ngClass]="'result-' + submitResult.level" style="margin-top:16px">
                {{ submitResult.message }}
            </div>
        </mat-card-content>
    </mat-card>
</div>
