<div class="mdp-container">
  <div class="page-header">
    <div>
      <h2>Shift Calendar</h2>
      <p class="subtitle">Weekly overview</p>
    </div>
    <div class="week-nav">
      <button mat-icon-button (click)="prevWeek()" matTooltip="Previous week">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span class="week-label">
        {{ weekDays[0] | date:'d MMM' }} – {{ weekDays[6] | date:'d MMM, y' }}
      </span>
      <button mat-icon-button (click)="nextWeek()" matTooltip="Next week">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button mat-stroked-button (click)="setWeek(new Date()); loadData()">Today</button>
    </div>
    <button *ngIf="canEdit" mat-raised-button color="primary">
      <mat-icon>add</mat-icon> Add Shift
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <div class="calendar-grid-wrapper">
        <table class="calendar-grid">
          <thead>
            <tr>
              <th class="employee-col">Employee</th>
              <th *ngFor="let day of weekDays" [class.today-col]="isToday(day)">
                {{ formatDate(day) }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let emp of employees">
              <td class="employee-cell">
                <div class="emp-name">{{ emp.name }}</div>
              </td>
              <td *ngFor="let day of weekDays" class="shift-cell" [class.today-col]="isToday(day)">
                <div *ngFor="let shift of getShiftsForCell(emp.id, day)"
                  class="shift-chip" [ngClass]="getStatusClass(shift.status)">
                  {{ shift.startTime }}–{{ shift.endTime }}
                </div>
                <button *ngIf="canEdit && getShiftsForCell(emp.id, day).length === 0"
                  mat-icon-button class="add-shift-btn" matTooltip="Add shift">
                  <mat-icon>add</mat-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Legend -->
      <div class="legend">
        <span class="legend-item shift-scheduled">Scheduled</span>
        <span class="legend-item shift-completed">Completed</span>
        <span class="legend-item shift-cancelled">Cancelled</span>
        <span class="legend-item shift-noshow">No Show</span>
      </div>
    </mat-card-content>
  </mat-card>
</div>
