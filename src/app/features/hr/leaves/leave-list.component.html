<div class="mdp-container">
    <div class="page-header">
        <div>
            <h2>{{ isApprover ? 'Leave Approvals' : 'My Leave Requests' }}</h2>
            <p class="subtitle" *ngIf="isApprover">Review and manage team leave requests</p>
            <p class="subtitle" *ngIf="!isApprover">View and submit your leave requests</p>
        </div>
        <div class="header-actions">
            <button *ngIf="!isApprover" mat-raised-button color="primary" (click)="openRequestDialog()">
                <mat-icon>add</mat-icon>
                Request Leave
            </button>
            <mat-chip-set *ngIf="isApprover">
                <mat-chip (click)="filters = { status: 'PENDING' }">Pending</mat-chip>
                <mat-chip (click)="filters = {}">All</mat-chip>
            </mat-chip-set>
        </div>
    </div>

    <mat-card>
        <mat-card-content>
            <mdp-meta-filter-bar
                    *ngIf="isApprover"
                    typeName="LeaveRequest"
                    (filtersChange)="onFiltersChange($event)">
            </mdp-meta-filter-bar>

            <mdp-entity-table
                    typeName="LeaveRequest"
                    [apiPath]="apiPath"
                    [filters]="filters"
                    [actions]="tableActions"
                    [reloadTrigger]="reloadTrigger">
            </mdp-entity-table>
        </mat-card-content>
    </mat-card>

    <!-- Pending Cancellations — manager view only -->
    <mat-card style="margin-top:16px" *ngIf="isApprover">
        <mat-card-header>
            <mat-icon mat-card-avatar>undo</mat-icon>
            <mat-card-title>Pending Cancellations</mat-card-title>
            <mat-card-subtitle>Employees requesting to cancel approved leave</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <mdp-entity-table
                    typeName="LeaveRequest"
                    [apiPath]="apiPath"
                    [filters]="{ status: 'PENDING_CANCELLATION' }"
                    [actions]="cancellationActions"
                    [reloadTrigger]="reloadTrigger">
            </mdp-entity-table>
        </mat-card-content>
    </mat-card>
</div>
