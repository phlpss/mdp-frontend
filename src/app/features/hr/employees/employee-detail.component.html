<div class="mdp-container" *ngIf="!loading; else loadingTpl">
    <div class="page-header">
        <div class="breadcrumb">
            <a mat-button routerLink="/hr/employees"><mat-icon>arrow_back</mat-icon> Employees</a>
            <span class="breadcrumb-sep">/</span>
            <span>{{ fullName }}</span>
        </div>
        <div class="header-actions">
            <button *ngIf="canEdit" mat-stroked-button (click)="openEditDialog()">
                <mat-icon>edit</mat-icon> Edit
            </button>
            <button *ngIf="canDeactivate && employee?.['isActive']" mat-raised-button color="warn" (click)="deactivate()">
                <mat-icon>person_off</mat-icon> Deactivate
            </button>
        </div>
    </div>

    <div class="detail-grid">
        <mat-card class="profile-card">
            <mat-card-content>
                <div class="avatar-section">
                    <div class="big-avatar">{{ initials }}</div>
                    <h3>{{ fullName }}</h3>
                    <span class="badge" [ngClass]="employee?.['isActive'] ? 'badge-active' : 'badge-inactive'">
            {{ employee?.['isActive'] ? 'Active' : 'Inactive' }}
          </span>
                    <div class="role-chip">{{ employee?.['role'] }}</div>
                </div>

                <mat-divider style="margin: 16px 0"></mat-divider>

                <div class="profile-sections" *ngIf="employee">
                    <div class="profile-section" *ngFor="let g of fieldGroups">
                        <h4 class="section-title" *ngIf="g.groupName">{{ g.groupName }}</h4>
                        <div class="field-row" *ngFor="let attr of g.attributes">
                            <span class="field-label">{{ attr.label }}</span>
                            <span class="field-value">
                {{ displayValue(attr) }}
                                <button *ngIf="isSensitive(attr) && canViewSensitive" mat-icon-button type="button"
                                        class="reveal-btn" (click)="toggleReveal(attr)"
                                        [matTooltip]="revealed[attr.name] ? 'Hide' : 'Show'">
                  <mat-icon>{{ revealed[attr.name] ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </span>
                        </div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>

<ng-template #loadingTpl>
    <div class="loading-overlay"><mat-spinner></mat-spinner></div>
</ng-template>
